name: X tableros

# Lee solo X (API pay-per-use, tope en x/config.json) para un tablero del módulo dirigentes,
# sin volver a correr YouTube, medios, Trends ni Wikipedia. Se corre a mano.
on:
  workflow_dispatch:
    inputs:
      tablero:
        description: 'Slug del tablero (p. ej. pagano)'
        required: true

permissions:
  contents: write

# Mismo grupo que "Dirigentes monitor": comparten la caché de textos y el registro de gasto
concurrency:
  group: dirigentes-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  x:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      TABLERO: ${{ inputs.tablero }}
    steps:
      - uses: actions/checkout@v4
      - name: Update to latest
        run: git fetch --depth=50 origin "${GITHUB_REF_NAME}" && git merge --ff-only FETCH_HEAD || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Check tablero
        run: |
          case "$TABLERO" in *[!a-z]*|'') echo "tablero inválido"; exit 1;; esac
          test -f "dirigentes/$TABLERO/config.json"
      - name: Install dependencies
        run: python -m pip install pandas
      - name: Install NLP models
        continue-on-error: true
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pysentimiento
      - name: Cache NLP models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-pysentimiento-v1
      - name: Restore store
        uses: actions/cache/restore@v4
        with:
          path: |
            dirigentes/pagano/.store
            dirigentes/casielles/.store
            dirigentes/braillard/.store
            dirigentes/clark/.store
          key: dirigentes-store-${{ github.run_id }}
          restore-keys: dirigentes-store-
      - name: Collect X and analyze
        run: |
          python dirigentes/collect.py "$TABLERO" --solo x
          python dirigentes/analyze.py "$TABLERO"
          cat "dirigentes/$TABLERO/.store/status.json" || true
          cat x/gasto.json || true
      - name: Save store
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            dirigentes/pagano/.store
            dirigentes/casielles/.store
            dirigentes/braillard/.store
            dirigentes/clark/.store
          key: dirigentes-store-${{ github.run_id }}
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "dirigentes/$TABLERO/data/monitor.json" "dirigentes/$TABLERO/data/textos.json" x/gasto.json
          if ! git diff --cached --quiet; then
            git commit -m "X: actualizar $TABLERO"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              sleep $((i * 5))
            done
            exit 1
          fi
