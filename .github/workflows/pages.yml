name: Publicar tablero (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Los workflows de datos hacen commit con el token de Actions, que no dispara "push": se publica al terminar
  workflow_run:
    workflows: ['Radar social listening', 'San Isidro reclamos', 'General Roca monitor', 'General San Martín monitor', 'Massa Galmarini monitor', 'Boca monitor', 'Santa Cruz monitor', 'Meta dirigentes', 'Dirigentes monitor', 'Instagram tableros', 'X tableros', 'Landing datos', 'Trump monitor', 'Brujula opinion y conversacion']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Cada tablero en una ruta secreta derivada del secret INDICE_RUTA (ver publicar_sitio.py).
      # Las rutas nunca se escriben en el repo ni en el log, que son públicos.
      - name: Armar sitio con rutas secretas
        env:
          INDICE_RUTA: ${{ secrets.INDICE_RUTA }}
          # URL /exec del Apps Script que recibe las respuestas del quiz (vacío = el quiz no envía nada)
          QUIZ_ENDPOINT: ${{ secrets.QUIZ_ENDPOINT }}
        run: python3 publicar_sitio.py "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # A veces deploy-pages no encuentra el artefacto recién subido ("No artifacts named github-pages"):
      # es una demora de la API de GitHub. Se reintenta una vez después de esperar.
      - name: Deploy GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Esperar antes de reintentar
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - name: Deploy GitHub Pages (reintento)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
