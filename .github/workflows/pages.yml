name: Publicar tablero (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Los workflows de datos hacen commit con el token de Actions, que no dispara "push": se publica al terminar
  workflow_run:
    workflows: ['Radar social listening', 'San Isidro reclamos', 'General Roca monitor', 'Massa Galmarini monitor', 'Boca monitor', 'Santa Cruz monitor', 'Meta dirigentes']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Copiar solo archivos públicos
        run: |
          mkdir -p _site/radar/data _site/sanisidro
          cp dashboard.html .nojekyll _site/
          cp dashboard.html _site/index.html
          # Versión en la URL del script: así el navegador no usa un panel.js viejo de caché tras publicar
          sed -i "s#massa/panel.js\"#massa/panel.js?v=${GITHUB_SHA::8}\"#" _site/dashboard.html _site/index.html
          cp -R assets _site/
          cp radar/index.html _site/radar/
          cp radar/data/*.json _site/radar/data/
          if [ -d radar/data/fuentes ]; then cp -R radar/data/fuentes _site/radar/data/; fi
          cp -R sanisidro/index.html sanisidro/data _site/sanisidro/
          mkdir -p _site/roca
          cp -R roca/index.html roca/data _site/roca/
          mkdir -p _site/massa
          cp -R massa/panel.js massa/data _site/massa/
          mkdir -p _site/boca
          cp -R boca/index.html boca/data _site/boca/
          mkdir -p _site/santacruz
          cp -R santacruz/index.html santacruz/data _site/santacruz/
          mkdir -p _site/meta
          if [ -d meta/data ]; then cp -R meta/data _site/meta/; fi
          cp resumen.js _site/
          sed -i "s#resumen.js\"#resumen.js?v=${GITHUB_SHA::8}\"#" _site/dashboard.html _site/index.html
      # Índice interno (no enlazado desde ningún tablero): se arma solo con cada carpeta publicada que tenga index.html
      - name: Armar índice interno
        run: |
          mkdir -p _site/indice
          {
            echo '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Índice</title></head><body><h1>Índice</h1><ul>'
            echo '<li><a href="../">Tablero nacional</a></li>'
            for f in _site/*/index.html; do
              d=$(basename "$(dirname "$f")")
              [ "$d" = indice ] && continue
              t=$(grep -o '<title>[^<]*' "$f" | head -1 | sed 's/<title>//')
              echo "<li><a href=\"../$d/\">${t:-$d}</a> <small>($d/)</small></li>"
            done
            echo '</ul></body></html>'
          } > _site/indice/index.html
          cat _site/indice/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
