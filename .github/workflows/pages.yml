name: Publicar tablero (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Los workflows de datos hacen commit con el token de Actions, que no dispara "push": se publica al terminar
  workflow_run:
    workflows: ['Radar social listening', 'San Isidro reclamos', 'General Roca monitor', 'Massa Galmarini monitor', 'Boca monitor', 'Santa Cruz monitor', 'Meta dirigentes', 'Dirigentes monitor', 'Instagram tableros', 'X tableros', 'Landing datos']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Cada tablero en una ruta secreta derivada del secret INDICE_RUTA (ver publicar_sitio.py).
      # Las rutas nunca se escriben en el repo ni en el log, que son públicos.
      - name: Armar sitio con rutas secretas
        env:
          INDICE_RUTA: ${{ secrets.INDICE_RUTA }}
        run: python3 publicar_sitio.py "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
