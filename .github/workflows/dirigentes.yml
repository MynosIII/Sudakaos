name: Dirigentes monitor

on:
  workflow_dispatch:
    inputs:
      tablero:
        description: 'Solo este tablero (slug, p. ej. strada). Vacío = todos'
        required: false
        default: ''
  # 08:15 UTC = 05:15 ART: primera corrida del día apenas se reinicia el cupo de YouTube (antes que Roca, Boca y Santa Cruz)
  schedule:
    - cron: '15 8 * * *'
  # Primera corrida (y cada vez que cambia el código o la configuración) en cualquier rama
  push:
    paths:
      - 'dirigentes/*/config.json'
      - 'dirigentes/*.py'
      - 'x/*.py'
      - 'x/config.json'
      - '.github/workflows/dirigentes.yml'

permissions:
  contents: write

concurrency:
  group: dirigentes-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      # Clave propia si se carga YOUTUBE_API_KEY_DIRIGENTES; si no, la de Roca (la del tablero nacional queda afuera)
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY_DIRIGENTES || secrets.YOUTUBE_API_KEY_ROCA }}
      RADAR_NLP_SECONDS: '420'
      # Sin X_BEARER_TOKEN a propósito: X es pago y solo se corre a mano (workflow "X tableros")
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      # Corridas en cola: partir del último main (registro de gasto de X incluido), no del commit que las disparó
      - name: Update to latest
        run: git fetch --depth=50 origin "${GITHUB_REF_NAME}" && git merge --ff-only FETCH_HEAD || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install pandas
      # Tono, emoción y agresividad con pysentimiento (gratis, CPU). Si falla, el análisis usa diccionarios.
      - name: Install NLP models
        continue-on-error: true
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pysentimiento
      - name: Cache NLP models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-pysentimiento-v1
      # Los textos completos no se suben al repositorio: viven en la caché del workflow.
      - name: Restore store
        uses: actions/cache/restore@v4
        with:
          path: |
            dirigentes/pagano/.store
            dirigentes/casielles/.store
            dirigentes/braillard/.store
            dirigentes/clark/.store
          key: dirigentes-store-${{ github.run_id }}
          restore-keys: dirigentes-store-
      - name: Restore store (tableros 2026-11)
        uses: actions/cache/restore@v4
        with:
          path: |
            dirigentes/raverta/.store
            dirigentes/otermin/.store
            dirigentes/rehl/.store
            dirigentes/ramos/.store
            dirigentes/avila/.store
            dirigentes/akirchner/.store
            dirigentes/zicarelli/.store
            dirigentes/presto/.store
            dirigentes/danann/.store
          key: dirigentes2-store-${{ github.run_id }}
          restore-keys: dirigentes2-store-
      - name: Restore store (tableros 2026-11-25)
        uses: actions/cache/restore@v4
        with:
          path: |
            dirigentes/strada/.store
          key: dirigentes3-store-${{ github.run_id }}
          restore-keys: dirigentes3-store-
      - name: Collect and analyze
        env:
          SOLO: ${{ inputs.tablero }}
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
        run: |
          TODOS="pagano casielles braillard clark raverta otermin rehl ramos avila akirchner zicarelli presto danann strada"
          LISTA="$TODOS"
          # A mano con un tablero, o un push que cambia configs sin tocar el código de recolección: correr solo esos (cuida el cupo de YouTube)
          if [ -n "$SOLO" ]; then
            case "$SOLO" in *[!a-z]*) echo "tablero inválido"; exit 1;; esac
            LISTA="$SOLO"
          elif [ "$EVENTO" = push ]; then
            # Rama nueva: no hay "antes", se compara con el commit anterior
            case "$ANTES" in ''|0000000000000000000000000000000000000000) ANTES="$GITHUB_SHA~1";; esac
            CAMBIOS=$(git diff --name-only "$ANTES" "$GITHUB_SHA" 2>/dev/null || true)
            CFG=$(echo "$CAMBIOS" | sed -n 's#^dirigentes/\([a-z]*\)/config.json$#\1#p' | tr '\n' ' ')
            if [ -n "$CFG" ] && ! echo "$CAMBIOS" | grep -q '^dirigentes/[a-z_]*\.py$\|^x/'; then
              LISTA="$CFG"
            fi
          fi
          echo "Tableros: $LISTA"
          for d in $LISTA; do
            echo "::group::$d"
            timeout 1200 python dirigentes/collect.py "$d" || echo "recolección de $d cortada por tiempo"
            python dirigentes/analyze.py "$d"
            cat "dirigentes/$d/.store/status.json" || true
            echo "::endgroup::"
          done
      - name: Save store
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            dirigentes/pagano/.store
            dirigentes/casielles/.store
            dirigentes/braillard/.store
            dirigentes/clark/.store
          key: dirigentes-store-${{ github.run_id }}
      - name: Save store (tableros 2026-11)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            dirigentes/raverta/.store
            dirigentes/otermin/.store
            dirigentes/rehl/.store
            dirigentes/ramos/.store
            dirigentes/avila/.store
            dirigentes/akirchner/.store
            dirigentes/zicarelli/.store
            dirigentes/presto/.store
            dirigentes/danann/.store
          key: dirigentes2-store-${{ github.run_id }}
      - name: Save store (tableros 2026-11-25)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            dirigentes/strada/.store
          key: dirigentes3-store-${{ github.run_id }}
      - name: Commit aggregates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dirigentes/*/data/monitor.json dirigentes/*/data/textos.json x/gasto.json 2>/dev/null || git add dirigentes/*/data/monitor.json dirigentes/*/data/textos.json
          if ! git diff --cached --quiet; then
            git commit -m 'Dirigentes: actualizar agregados'
            for i in 1 2 3; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              sleep $((i * 5))
            done
            exit 1
          fi
