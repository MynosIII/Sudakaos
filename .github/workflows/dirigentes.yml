name: Dirigentes monitor

on:
  workflow_dispatch:
  # 08:15 UTC = 05:15 ART: primera corrida del día apenas se reinicia el cupo de YouTube (antes que Roca, Boca y Santa Cruz)
  schedule:
    - cron: '15 8 * * *'
  # Primera corrida (y cada vez que cambia el código o la configuración) en cualquier rama
  push:
    paths:
      - 'dirigentes/*/config.json'
      - 'dirigentes/*.py'
      - '.github/workflows/dirigentes.yml'

permissions:
  contents: write

concurrency:
  group: dirigentes-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Clave propia si se carga YOUTUBE_API_KEY_DIRIGENTES; si no, la de Roca (la del tablero nacional queda afuera)
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY_DIRIGENTES || secrets.YOUTUBE_API_KEY_ROCA }}
      RADAR_NLP_SECONDS: '420'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install pandas
      # Tono, emoción y agresividad con pysentimiento (gratis, CPU). Si falla, el análisis usa diccionarios.
      - name: Install NLP models
        continue-on-error: true
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pysentimiento
      - name: Cache NLP models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-pysentimiento-v1
      # Los textos completos no se suben al repositorio: viven en la caché del workflow.
      - name: Restore store
        uses: actions/cache/restore@v4
        with:
          path: |
            dirigentes/pagano/.store
            dirigentes/casielles/.store
            dirigentes/braillard/.store
          key: dirigentes-store-${{ github.run_id }}
          restore-keys: dirigentes-store-
      - name: Collect and analyze
        run: |
          for d in pagano casielles braillard; do
            echo "::group::$d"
            timeout 900 python dirigentes/collect.py "$d" || echo "recolección de $d cortada por tiempo"
            python dirigentes/analyze.py "$d"
            cat "dirigentes/$d/.store/status.json" || true
            echo "::endgroup::"
          done
      - name: Save store
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            dirigentes/pagano/.store
            dirigentes/casielles/.store
            dirigentes/braillard/.store
          key: dirigentes-store-${{ github.run_id }}
      - name: Commit aggregates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dirigentes/*/data/monitor.json dirigentes/*/data/textos.json
          if ! git diff --cached --quiet; then
            git commit -m 'Dirigentes: actualizar agregados'
            for i in 1 2 3; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              sleep $((i * 5))
            done
            exit 1
          fi
