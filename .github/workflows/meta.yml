name: Meta dirigentes

on:
  workflow_dispatch:
  schedule:
    - cron: '20 12 * * *'
  push:
    paths:
      - 'meta/config.json'
      - 'meta/*.py'
      - '.github/workflows/meta.yml'

permissions:
  contents: write

concurrency:
  group: meta-dirigentes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Token de usuario de larga duración (Graph API, gratis) y el id de la cuenta de Instagram profesional propia
      META_TOKEN: ${{ secrets.META_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect Instagram + Biblioteca de anuncios
        run: timeout 1500 python -u meta/collect.py
      - name: Commit aggregates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add meta/data/meta.json
          if ! git diff --cached --quiet; then
            git commit -m 'Meta: actualizar agregados'
            for i in 1 2 3; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              sleep $((i * 5))
            done
            exit 1
          fi
