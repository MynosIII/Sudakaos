name: Instagram tableros

on:
  workflow_dispatch:
  schedule:
    # después de "Meta dirigentes" (12:20 UTC), que resuelve los usuarios compartidos
    - cron: '50 12 * * *'
  push:
    branches: [main]
    paths:
      - 'ig/config.json'
      - 'ig/*.py'
      - '.github/workflows/ig.yml'

permissions:
  contents: write

concurrency:
  # mismo grupo que meta.yml: comparten token y cupo de la app de Meta, nunca en paralelo
  group: meta-dirigentes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Mismo token y cuenta que meta.yml (Graph API, gratis)
      META_TOKEN: ${{ secrets.META_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect Instagram por tablero
        run: timeout 2100 python ig/collect.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ig/data ig/store
          if ! git diff --cached --quiet; then
            git commit -m 'Instagram: actualizar reporte por tablero'
            for i in 1 2 3; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              sleep $((i * 5))
            done
            exit 1
          fi
